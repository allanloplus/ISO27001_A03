<title>資訊保護生命週期</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 一張 1280×720 的投影舞台等比縮放置中；左側 Q 版講師，右側為逐步揭露的內容，底部為同步字幕。
   單一視覺世界（深色講堂襯底 + 淺色投影片），刻意不隨主題切換。 */
:root {
  --surround: #0d1830;
  --surround-2: #15244a;
  --paper: #f4f7fb;
  --ink: #1a2643;
  --muted: #5a6784;
  --line: #d3dbe8;
  --band: #4472c4;
  --ring: #9fcf88;
  --ring-deep: #5c9a42;
  --ops: #2c5cb5;
  --ops-bg: #e6edfb;
  --audit: #0e7c84;
  --audit-bg: #def1f1;
  --fault: #c4442d;
  --fault-bg: #fbe8e3;
  --hl: #ffcf3f;
  --pink: #ff6f9a;
  --pink-bg: #ffe8ef;
  --amber: #d4861a;
  --good: #4f9a35;
  --good-bg: #e9f5e2;
  --white: #ffffff;
  --sub-bg: rgba(13, 24, 48, .9);
  --sub-fg: #f4f7fb;
  --display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "WenQuanYi Zen Hei", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "WenQuanYi Zen Hei", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 30%, var(--surround-2), var(--surround) 70%);
  background-color: var(--surround);
  color: var(--sub-fg);
  font-family: var(--body);
  overflow: hidden;
}
.app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-inline: 16px; padding-block: 12px; box-sizing: border-box; }
.viewport { position: relative; width: 100%; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
.stage-wrap { position: relative; }
#stage {
  position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
  transform-origin: 0 0; background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
}
body.record .app { padding: 0; }
body.record #stage { border-radius: 0; box-shadow: none; }
#curtain { position: fixed; inset: 0; background: #000; z-index: 99; }
body.record .dock, body.record .start-btn { display: none !important; }

/* ── top bar ── */
.topbar { position: absolute; left: 0; right: 0; top: 0; height: 86px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px 0 36px; border-bottom: 1px solid var(--line); background: var(--white); }
.eyebrow { font: 700 13px/1 var(--mono); letter-spacing: .14em; color: var(--band); text-transform: uppercase; }
.topbar h1 { margin: 8px 0 0; font: 900 30px/1.1 var(--display); letter-spacing: .02em; text-wrap: balance; }
.rail { display: flex; align-items: center; gap: 0; }
.rail .node { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 54px; font: 500 12px/1 var(--body); color: var(--muted); transition: color .4s; }
.rail .dot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--line); background: var(--white); transition: all .4s; }
.rail .bar { width: 14px; height: 4px; background: var(--line); margin-bottom: 17px; }
.rail .node.on { color: var(--ink); font-weight: 700; }
.rail .node.on .dot { border-color: var(--ring-deep); background: var(--ring); transform: scale(1.25); box-shadow: 0 0 0 4px rgba(159, 207, 136, .35); }
#stage[data-type="cover"] .topbar { display: none; }

/* ── content ── */
#content { position: absolute; left: 318px; right: 30px; top: 100px; bottom: 96px; }
#stage[data-type="cover"] #content { left: 0; right: 0; top: 0; bottom: 78px; }

/* ── subtitles ── */
.subs { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: var(--sub-bg); color: var(--sub-fg); display: flex; align-items: center; gap: 18px; padding: 0 34px 0 196px; }
.subs .who { position: absolute; left: 26px; width: 150px; top: 50%; transform: translateY(-50%); font: 700 13px/1.3 var(--mono); color: var(--ring); letter-spacing: .08em; }
.subs[data-who="arale"] .who { color: var(--pink); }
.subs .who small { display: block; font: 500 12px/1.3 var(--body); color: #b9c4dc; letter-spacing: 0; }
#subText { font: 500 22px/1.45 var(--body); letter-spacing: .02em; text-wrap: balance; transition: opacity .2s; }
.subs.off #subText { opacity: 0; }

/* ── Allan ── */
.allan { position: absolute; left: 0; bottom: 78px; width: 204px; height: 278px; transition: all .8s cubic-bezier(.2, .8, .2, 1); z-index: 5; }
#stage[data-type="cover"] .allan { left: 40px; bottom: 96px; width: 320px; height: 436px; }
.arale { position: absolute; left: 178px; bottom: 80px; width: 132px; height: 198px; z-index: 6; transition: all .8s cubic-bezier(.2, .8, .2, 1); }
#stage[data-type="cover"] .arale { left: 340px; bottom: 96px; width: 200px; height: 300px; }
.arale svg { width: 100%; height: 100%; overflow: visible; }
.arale.talking svg { animation: hop .5s ease-in-out infinite; }
.arale .head { animation: bob 2.2s ease-in-out infinite; transform-box: view-box; }
.arale .eyes { transform-box: fill-box; transform-origin: center; animation: blink 3.6s infinite; }
.arale .arm { transform-box: view-box; transform-origin: 104px 146px; transition: transform .4s cubic-bezier(.3, 1.4, .5, 1); }
.arale.talking .arm { transform: rotate(-125deg); }
.arale .mo { transform-box: fill-box; transform-origin: 50% 0; }
@keyframes hop { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
.allan svg { width: 100%; height: 100%; overflow: visible; }
.allan #head { animation: bob 2.6s ease-in-out infinite; transform-box: view-box; }
.allan.talking #head { animation: nod .5s ease-in-out infinite; }
.allan #eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
.allan #armR { transform-box: view-box; transform-origin: 152px 186px; transition: transform .45s cubic-bezier(.3, 1.4, .5, 1); }
.allan.point #armR { transform: rotate(-78deg); }
.allan.wave #armR { animation: wave .7s ease-in-out infinite; }
.allan #mouthOpen { transform-box: fill-box; transform-origin: 50% 0; }
.bubble { position: absolute; left: 330px; top: 70px; background: var(--white); border: 3px solid var(--ink); border-radius: 22px; padding: 12px 20px; font: 900 26px/1.2 var(--display); color: var(--ink); opacity: 0; transform: scale(.6); transform-origin: 0 100%; transition: all .4s cubic-bezier(.3, 1.5, .5, 1); }
.bubble::after { content: ""; position: absolute; left: 22px; bottom: -16px; border: 9px solid transparent; border-top-color: var(--ink); border-left-color: var(--ink); }
#stage[data-type="cover"] .bubble.show { opacity: 1; transform: none; }
#stage:not([data-type="cover"]) .bubble { display: none; }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
@keyframes nod { 0%, 100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(1.5px) rotate(.8deg) } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.08) } }
@keyframes wave { 0%, 100% { transform: rotate(-150deg) } 50% { transform: rotate(-118deg) } }

/* ── cover ── */
.cover { position: absolute; inset: 0; background:
  linear-gradient(90deg, rgba(68, 114, 196, .07) 1px, transparent 1px) 0 0 / 40px 40px,
  linear-gradient(rgba(68, 114, 196, .07) 1px, transparent 1px) 0 0 / 40px 40px, var(--paper); }
.cover .txt { position: absolute; left: 570px; right: 60px; top: 120px; }
.cover .txt .eyebrow { font-size: 15px; }
.cover h2 { margin: 18px 0 10px; font: 900 76px/1.05 var(--display); letter-spacing: .03em; color: var(--ink); }
.cover h2 span { color: var(--band); }
.cover .sub { font: 500 21px/1.5 var(--body); color: var(--muted); margin: 0 0 30px; }
.facets { display: flex; gap: 12px; flex-wrap: wrap; }
.facet { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; font: 700 18px/1 var(--body); }
.facet svg { width: 20px; height: 20px; }
.facet.ops { background: var(--ops-bg); color: var(--ops); }
.facet.audit { background: var(--audit-bg); color: var(--audit); }
.facet.faults { background: var(--fault-bg); color: var(--fault); }
.cover .loop { position: absolute; left: 570px; right: 60px; bottom: 40px; display: flex; align-items: center; gap: 10px; font: 700 16px/1 var(--body); color: var(--ink); }
.cover .loop i { flex: 1; height: 8px; background: var(--band); border-radius: 4px; }
.cover .loop b { width: 62px; height: 62px; border-radius: 50%; border: 6px solid var(--ring); background: var(--white); display: grid; place-items: center; font-size: 16px; }
.start-btn { margin-top: 34px; display: inline-flex; align-items: center; gap: 12px; padding: 16px 30px; border: 0; border-radius: 999px; background: var(--ink); color: var(--white); font: 900 22px/1 var(--display); cursor: pointer; box-shadow: 0 8px 0 #0a1226; transition: transform .1s, box-shadow .1s; }
.start-btn:hover { background: #24345c; }
.start-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #0a1226; }
.start-btn:focus-visible { outline: 4px solid var(--hl); outline-offset: 3px; }
.start-btn svg { width: 22px; height: 22px; }

/* ── control table ── */
.ctable { height: 100%; display: grid; grid-template-columns: 150px repeat(3, minmax(0, 1fr)); grid-template-rows: auto; grid-auto-rows: 1fr; gap: 10px; }
.chead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; font: 900 17px/1 var(--display); color: var(--white); }
.chead svg { width: 20px; height: 20px; flex: none; }
.chead.blank { background: transparent; }
.chead.ops { background: var(--ops); }
.chead.audit { background: var(--audit); }
.chead.faults { background: var(--fault); }
.cid { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 12px 14px; border-radius: 10px; background: var(--white); border: 2px solid var(--line); transition: border-color .4s, box-shadow .4s; min-width: 0; }
.cid .num { font: 700 28px/1 var(--mono); color: var(--band); }
.cid .nm { font: 900 17px/1.3 var(--display); color: var(--ink); text-wrap: balance; }
.cid.live { border-color: var(--ring-deep); box-shadow: 0 0 0 4px rgba(159, 207, 136, .35); }
.cell { position: relative; border-radius: 10px; padding: 12px 14px 12px 12px; min-width: 0; transition: opacity .5s, transform .5s cubic-bezier(.2, .9, .3, 1.2), box-shadow .4s, filter .5s; }
.cell.ops { background: var(--ops-bg); }
.cell.audit { background: var(--audit-bg); }
.cell.faults { background: var(--fault-bg); }
.cell ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.cell li { position: relative; padding-left: 16px; font: 500 15px/1.5 var(--body); color: var(--ink); }
.cell li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; border-radius: 2px; }
.cell.ops li::before { background: var(--ops); }
.cell.audit li::before { background: var(--audit); }
.cell.faults li::before { background: var(--fault); transform: rotate(45deg); }
.ctable.n1 .cell li { font-size: 19px; }
.ctable.n1 .cell ul { gap: 18px; }
.ctable.n1 .cell { padding: 20px 18px; }
.ctable.n1 .cid .num { font-size: 40px; }
.ctable.n1 .cid .nm { font-size: 22px; }
.cell.off { opacity: .12; transform: translateY(8px); filter: grayscale(1); }
.cell.now { box-shadow: 0 0 0 3px var(--hl), 0 10px 24px rgba(26, 38, 67, .18); transform: scale(1.025); z-index: 2; }
.cell .stamp { position: absolute; right: -8px; top: -12px; padding: 4px 9px; border-radius: 6px; background: var(--fault); color: var(--white); font: 900 13px/1 var(--display); transform: rotate(6deg); opacity: 0; transition: opacity .3s .3s; }
.cell.faults.now .stamp, .cell.faults.seen .stamp { opacity: 1; }

/* ── lifecycle diagram ── */
.lc svg { width: 100%; height: 100%; }
.lc text { font-family: var(--body); fill: var(--ink); }
.lc .g { transition: opacity .6s; }
.lc .g.dim { opacity: .14; }
.lc .g.now .ring { animation: pulse 1.4s ease-in-out infinite; }
.lc .flow { stroke-dasharray: 10 22; animation: flow 1.2s linear infinite; }
.lc .policy-box { transition: stroke .4s; }
.lc .g.now .policy-box { stroke: var(--hl); stroke-width: 4; }
@keyframes pulse { 0%, 100% { stroke-width: 10 } 50% { stroke-width: 15 } }
@keyframes flow { to { stroke-dashoffset: -32 } }

/* ── trace ── */
.trace { position: relative; height: 100%; display: flex; flex-direction: column; }
.trace .lead { font: 500 19px/1.5 var(--body); color: var(--muted); margin: 4px 0 0; }
.trace .lane { position: relative; flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; padding-top: 112px; }
.trace .lane::before { content: ""; position: absolute; left: 4%; right: 4%; top: 152px; height: 10px; border-radius: 5px; background: var(--band); opacity: .9; }
.trace .step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; transition: opacity .5s, transform .5s; }
.trace .step.off { opacity: .18; transform: translateY(10px); }
.trace .ringdot { width: 70px; height: 70px; border-radius: 50%; background: var(--white); border: 9px solid var(--ring); box-sizing: border-box; display: grid; place-items: center; font: 900 15px/1.1 var(--display); color: var(--ink); z-index: 1; transition: border-color .4s, transform .4s; }
.trace .step.now .ringdot { border-color: var(--ring-deep); transform: scale(1.12); }
.trace .ph { margin-top: 12px; font: 900 21px/1.2 var(--display); }
.trace .ctl { margin-top: 6px; font: 700 12px/1.45 var(--mono); letter-spacing: -.02em; color: var(--band); min-height: 2.8em; }
.trace .q { margin-top: 10px; padding: 14px 14px; border-radius: 12px; background: var(--white); border: 2px solid var(--line); font: 500 17px/1.55 var(--body); color: var(--ink); width: 100%; box-sizing: border-box; text-align: left; transition: border-color .4s, box-shadow .4s; }
.trace .step.now .q { border-color: var(--hl); box-shadow: 0 10px 24px rgba(26, 38, 67, .14); }
.trace .token { position: absolute; top: 16px; left: 0; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform 1s cubic-bezier(.5, 0, .2, 1); z-index: 3; }
.trace .token svg { width: 64px; height: 76px; filter: drop-shadow(0 6px 10px rgba(26, 38, 67, .25)); }
.trace .token span { font: 900 14px/1 var(--display); background: var(--fault); color: var(--white); padding: 4px 8px; border-radius: 4px; }

/* ── summary ── */
.summary { height: 100%; display: flex; flex-direction: column; gap: 26px; justify-content: center; }
.mantra { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.mt { padding: 26px 10px 20px; border-radius: 14px; background: var(--white); border: 3px solid var(--line); text-align: center; transition: opacity .5s, transform .6s cubic-bezier(.3, 1.5, .5, 1), border-color .4s; }
.mt .w { font: 900 40px/1.1 var(--display); color: var(--ink); letter-spacing: .04em; }
.mt .s { margin-top: 10px; font: 700 15px/1 var(--body); color: var(--muted); }
.mt:nth-child(1) .w { color: var(--band); }
.mt:nth-child(5) .w { color: var(--fault); }
.mt.off { opacity: .1; transform: translateY(18px) scale(.94); }
.mt.on { border-color: var(--ring); }
.bye { padding: 22px 26px; border-radius: 14px; background: var(--ink); color: var(--paper); font: 700 23px/1.6 var(--body); transition: opacity .6s, transform .6s; }
.bye b { color: var(--hl); }
.bye.off { opacity: .1; transform: translateY(12px); }

/* ── case ── */
.case { height: 100%; display: flex; flex-direction: column; gap: 14px; }
.case-head { display: flex; gap: 10px; align-items: center; }
.ctag { padding: 7px 12px; border-radius: 6px; background: var(--ink); color: var(--white); font: 900 15px/1 var(--display); }
.cctl { padding: 5px 10px; border: 2px solid var(--band); border-radius: 6px; color: var(--band); font: 700 14px/1 var(--mono); }
.case h3 { margin: 0; font: 900 31px/1.25 var(--display); color: var(--ink); text-wrap: balance; }
.panels { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.panel { position: relative; padding: 16px 16px 14px; border-radius: 12px; background: var(--white); border: 2px solid var(--line); border-top: 6px solid var(--band); transition: opacity .5s, transform .5s cubic-bezier(.2, .9, .3, 1.2), box-shadow .4s; }
.panel.p1 { border-top-color: var(--fault); }
.panel.p2 { border-top-color: var(--amber); }
.panel.p3 { border-top-color: var(--good); background: var(--good-bg); }
.panel:not(:last-child)::after { content: ""; position: absolute; right: -15px; top: 50%; border: 7px solid transparent; border-left: 9px solid var(--muted); transform: translateY(-50%); }
.pk { display: flex; align-items: center; gap: 8px; font: 900 19px/1 var(--display); color: var(--ink); }
.pk b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--band); color: var(--white); font: 700 14px/1 var(--mono); }
.panel.p1 .pk b { background: var(--fault); }
.panel.p2 .pk b { background: var(--amber); }
.panel.p3 .pk b { background: var(--good); }
.panel p { margin: 14px 0 0; font: 500 19.5px/1.7 var(--body); color: var(--ink); }
.panel.off { opacity: .12; transform: translateY(10px); }
.panel.now { box-shadow: 0 0 0 3px var(--hl), 0 10px 24px rgba(26, 38, 67, .16); transform: scale(1.02); }
.tip { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-radius: 12px; background: var(--ink); color: var(--paper); font: 700 18px/1.5 var(--body); transition: opacity .5s; }
.tip .tl { flex: none; padding: 5px 10px; border-radius: 6px; background: var(--hl); color: var(--ink); font: 900 14px/1 var(--display); }
.tip.off { opacity: .1; }
.note { margin-top: -6px; font: 500 12px/1 var(--body); color: var(--muted); text-align: right; }

/* ── quiz ── */
.quiz { height: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.qz { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 14px; background: var(--white); border: 2px solid var(--line); transition: opacity .5s, transform .5s cubic-bezier(.3, 1.4, .5, 1), box-shadow .4s; }
.qz.off { opacity: .12; transform: translateY(12px) scale(.97); }
.qz.now { box-shadow: 0 0 0 3px var(--hl), 0 10px 24px rgba(26, 38, 67, .16); }
.qn { align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: var(--pink); color: var(--white); font: 700 16px/1 var(--mono); }
.qq { font: 900 21px/1.45 var(--display); color: var(--ink); }
.opts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.opts li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); font: 500 16px/1.45 var(--body); color: var(--ink); transition: all .4s; }
.opts li b { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--line); font: 700 13px/1 var(--mono); }
.qz.ans .opts li.right { border-color: var(--good); background: var(--good-bg); font-weight: 700; }
.qz.ans .opts li.right b { background: var(--good); border-color: var(--good); color: var(--white); }
.qz.ans .opts li:not(.right) { opacity: .45; }
.why { margin-top: auto; font: 700 15px/1.5 var(--body); color: var(--good); opacity: 0; transition: opacity .4s .2s; }
.qz.ans .why { opacity: 1; }

/* ── dock (player controls, outside the stage) ── */
.dock { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
.dock button { display: inline-flex; align-items: center; gap: 6px; height: 40px; min-width: 40px; padding: 0 12px; border: 1px solid #2e4170; border-radius: 10px; background: #172a52; color: #e8eef9; font: 700 14px/1 var(--body); cursor: pointer; }
.dock button:hover { background: #20386b; }
.dock button:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
.dock button[aria-pressed="true"] { background: var(--ring-deep); border-color: var(--ring-deep); color: var(--white); }
.dock svg { width: 18px; height: 18px; }
.dock .count { font: 700 14px/1 var(--mono); color: #b9c4dc; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; }
.dots button { width: 14px; min-width: 14px; height: 14px; padding: 0; border-radius: 50%; background: #2e4170; border: 0; }
.dots button.cur { background: var(--ring); }
@media (max-width: 640px) { .dots { display: none; } .dock button .lbl { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<div class="app">
  <div class="viewport" id="viewport">
    <div class="stage-wrap" id="stageWrap">
      <div id="stage" data-type="cover" role="region" aria-label="動畫簡報">

/* ── state per slide: apply acts 0..upto (upto = Infinity → fully revealed, no focus) ── */
function applyState(s, upto) {
  const acts = s.segs.map((g) => g.act || "");
  const done = upto === Infinity ? acts : acts.slice(0, upto + 1);
  let cur = null;
  if (upto !== Infinity) for (let k = upto; k >= 0; k--) if (acts[k]) { cur = acts[k]; break; }
  if (s.type === "controls") {
    content.querySelectorAll(".cell").forEach((c) => {
      const key = "cell:" + c.dataset.cell;
      c.classList.toggle("off", !done.includes(key));
      c.classList.toggle("now", key === cur);
      c.classList.toggle("seen", done.includes(key));
    });
    const row = cur ? cur.split(":")[1] : null;
    content.querySelectorAll(".cid").forEach((c) => c.classList.toggle("live", c.dataset.r === row));
  } else if (s.type === "lifecycle") {
    const shown = done.map((a) => a.replace("lc:", ""));
    content.querySelectorAll(".g").forEach((g) => {
      const k = g.dataset.g;
      const vis = k === "band" ? shown.length > 0 : shown.includes(k);
      g.classList.toggle("dim", !vis);
      g.classList.toggle("now", cur === "lc:" + k);
    });
  } else if (s.type === "trace") {
    const n = upto === Infinity ? s.steps.length - 1 : Math.max(-1, ...done.map((a) => +a.split(":")[1]));
    const curStep = cur ? +cur.split(":")[1] : -2;
    content.querySelectorAll(".step").forEach((el) => {
      const i = +el.dataset.step;
      el.classList.toggle("off", i > n);
      el.classList.toggle("now", i === curStep);
    });
    moveToken(n);
  } else if (s.type === "case") {
    content.querySelectorAll(".panel").forEach((p) => {
      const key = "case:" + p.dataset.p;
      p.classList.toggle("off", !done.includes(key));
      p.classList.toggle("now", key === cur);
    });
    content.querySelector(".tip").classList.toggle("off", !done.includes("tip"));
  } else if (s.type === "quiz") {
    content.querySelectorAll(".qz").forEach((q) => {
      const i = q.dataset.q;
      q.classList.toggle("off", !done.includes("q:" + i));
      q.classList.toggle("ans", done.includes("ans:" + i));
      q.classList.toggle("now", cur === "q:" + i || cur === "ans:" + i);
    });
  } else if (s.type === "summary") {
    content.querySelectorAll(".mt").forEach((m) => { m.classList.toggle("off", !done.includes("mantra")); m.classList.toggle("on", done.includes("mantra")); });
    content.querySelector(".bye").classList.toggle("off", !done.includes("bye"));
    allanEl.classList.toggle("wave", cur === "bye");
  }
}
function moveToken(n) {
  const lane = $("lane"), tok = $("token");
  if (!lane || !tok) return;
  const col = (lane.clientWidth - 16 * 4) / 5;
  const x = n < 0 ? -10 : n * (col + 16) + col / 2 - 60;
  tok.style.transform = `translateX(${x}px)`;
}

/* ── player ── */
let si = 0, gi = -1, playing = false, segTimer = null, gapTimer = null, segStart = 0, rafId = 0;
const audio = new Audio();
audio.preload = "auto";
let subsOn = true;

function renderSlide(i) {
  si = i;
  const s = DATA.slides[i];
  stage.dataset.type = s.type;
  $("slideTitle").textContent = s.title || DATA.meta.title;
  content.innerHTML = RENDER[s.type](s);
  document.querySelectorAll(".rail .node").forEach((n) => n.classList.toggle("on", (s.phases || []).includes(+n.dataset.i)));
  allanEl.classList.remove("wave", "point");
  $("count").textContent = `${i + 1} / ${DATA.slides.length}`;
  document.querySelectorAll("#dots button").forEach((b, k) => b.classList.toggle("cur", k === i));
  const sb = $("startBtn");
  if (sb) sb.addEventListener("click", () => play());
  if (location.hash !== "#record") { try { history.replaceState(null, "", i ? "#s" + (i + 1) : location.pathname); } catch (e) {} }
}

function setSub(text) { subText.textContent = text; }

function tickSubs() {
  const seg = DATA.slides[si].segs[gi];
  if (!seg) return;
  const t = RECORD ? (performance.now() - segStart) / 1000 : audio.currentTime;
  let cue = seg.cues[0];
  for (const c of seg.cues) if (c[0] <= t + 0.05) cue = c;
  if (cue && subText.textContent !== cue[1]) setSub(cue[1]);
  rafId = requestAnimationFrame(tickSubs);
}

function playSeg() {
  const s = DATA.slides[si], seg = s.segs[gi];
  applyState(s, gi);
  setSpeaker(seg.who);
  if (s.type !== "cover" && speaker === "allan" && seg.act) gesture();
  setSub(seg.cues[0] ? seg.cues[0][1] : seg.say);
  cancelAnimationFrame(rafId);
  if (RECORD) {
    window.__log.push({ audio: seg.audio, t: Date.now() });
    segStart = performance.now();
    setTalking(true);
    segTimer = setTimeout(onSegEnd, seg.dur * 1000);
    rafId = requestAnimationFrame(tickSubs);
    return;
  }
  audio.src = seg.audio;
  audio.play().then(() => { rafId = requestAnimationFrame(tickSubs); }).catch(() => speakFallback(seg));
}

/* 若音檔無法播放，改用瀏覽器內建的台灣中文語音 */
function speakFallback(seg) {
  if (!("speechSynthesis" in window)) { segTimer = setTimeout(onSegEnd, seg.dur * 1000); return; }
  const u = new SpeechSynthesisUtterance(seg.say);
  const v = speechSynthesis.getVoices().find((v) => /zh[-_]TW/i.test(v.lang));
  if (v) u.voice = v;
  u.lang = "zh-TW";
  u.onstart = () => setTalking(true);
  u.onend = () => { setTalking(false); if (playing) onSegEnd(); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function onSegEnd() {
  setTalking(false);
  cancelAnimationFrame(rafId);
  if (!playing) return;
  const s = DATA.slides[si];
  if (gi + 1 < s.segs.length) {
    gapTimer = setTimeout(() => { gi++; playSeg(); }, 380);
  } else if (si + 1 < DATA.slides.length) {
    gapTimer = setTimeout(() => { renderSlide(si + 1); gi = 0; gapTimer = setTimeout(playSeg, 600); }, 900);
  } else {
    playing = false;
    updatePlayBtn();
    applyState(s, Infinity);
    if (RECORD) gapTimer = setTimeout(() => { window.__done = true; }, 1500);
  }
}

audio.addEventListener("playing", () => setTalking(true));
audio.addEventListener("pause", () => setTalking(false));
audio.addEventListener("ended", onSegEnd);
audio.addEventListener("error", () => { if (playing && gi >= 0) speakFallback(DATA.slides[si].segs[gi]); });

function stopAll() {
  clearTimeout(segTimer); clearTimeout(gapTimer); cancelAnimationFrame(rafId);
  audio.pause();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  setTalking(false);
}
function play() {
  if (playing) return;
  playing = true; updatePlayBtn();
  const s = DATA.slides[si];
  if (gi >= 0 && gi < s.segs.length && audio.src && audio.currentTime > 0 && !audio.ended) {
    audio.play().then(() => { rafId = requestAnimationFrame(tickSubs); }).catch(() => speakFallback(s.segs[gi]));
  } else {
    gi = 0; playSeg();
  }
}
function pause() { playing = false; updatePlayBtn(); stopAll(); }
function go(i) {
  if (i < 0 || i >= DATA.slides.length) return;
  const was = playing;
  stopAll(); audio.removeAttribute("src"); audio.load();
  renderSlide(i); gi = -1;
  if (was) { gi = 0; playSeg(); }
  else { applyState(DATA.slides[i], Infinity); setSub("（已暫停）按下播放，Allan 老師從這一頁開始講解。"); }
}
function updatePlayBtn() {
  $("icoPlay").innerHTML = playing ? ICON.pause : ICON.play;
  $("playLbl").textContent = playing ? "暫停" : "播放";
}

/* ── dock ── */
$("dots").innerHTML = DATA.slides.map((s, i) => `<button aria-label="第 ${i + 1} 頁：${esc(s.title || DATA.meta.title)}" title="${esc(s.title || DATA.meta.title)}"></button>`).join("");
document.querySelectorAll("#dots button").forEach((b, i) => b.addEventListener("click", () => go(i)));
$("btnPrev").addEventListener("click", () => go(si - 1));
$("btnNext").addEventListener("click", () => go(si + 1));
$("btnPlay").addEventListener("click", () => (playing ? pause() : play()));
$("btnSub").addEventListener("click", (e) => { subsOn = !subsOn; $("subs").classList.toggle("off", !subsOn); e.currentTarget.setAttribute("aria-pressed", subsOn); });
$("btnFull").addEventListener("click", () => {
  const el = document.documentElement;
  try { document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen().catch(() => {}); } catch (e) {}
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "ArrowRight" || e.key === "PageDown") go(si + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") go(si - 1);
  else if (e.key === "c" || e.key === "C") $("btnSub").click();
  else if (e.key === "f" || e.key === "F") $("btnFull").click();
});

/* ── scale stage to fit ── */
function fit() {
  const vp = $("viewport"), wrap = $("stageWrap");
  const k = RECORD ? 1 : Math.min(vp.clientWidth / 1280, vp.clientHeight / 720);
  stage.style.transform = `scale(${k})`;
  wrap.style.width = 1280 * k + "px";
  wrap.style.height = 720 * k + "px";
  if (DATA.slides[si].type === "trace") applyState(DATA.slides[si], playing ? gi : Infinity);
}
window.addEventListener("resize", fit);

/* ── boot ── */
const start = Math.max(0, Math.min(DATA.slides.length - 1, (+(location.hash.match(/^#s(\d+)$/) || [])[1] || 1) - 1));
renderSlide(start);
applyState(DATA.slides[start], Infinity);
fit();
if (RECORD) {
  window.__log = [];
  const cur = document.createElement("div"); cur.id = "curtain"; document.body.appendChild(cur);
  window.__startRecord = () => { cur.remove(); window.__t0 = Date.now(); playing = true; gi = 0; gapTimer = setTimeout(playSeg, 1200); };
}
</script>
